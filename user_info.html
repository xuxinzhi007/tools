<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色档案 · 数据采集模板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg-1: #f6f8fc;
    --bg-2: #eef2f7;
    --ink: #0f172a;
    --ink-2: #334155;
    --ink-3: #64748b;
    --ink-4: #94a3b8;
    --accent: #3b82f6;
    --accent-soft: #eef4ff;
    --line: #e9eef3;
    --dash: #e2e8f0;
    --ok: #10b981;
    --warn: #f59e0b;
    --danger: #ef4444;
}

body {
    background: linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 100%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 1.4rem 1.5rem 3rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--ink);
    gap: 1.1rem;
}

/* ============ 工具栏 ============ */
.toolbar {
    position: sticky;
    top: 0.8rem;
    z-index: 100;
    width: 100%;
    max-width: 1300px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(14px);
    border-radius: 1.4rem;
    border: 1px solid #ffffff;
    box-shadow: 0 12px 28px -18px rgba(15,23,42,0.45);
    padding: 0.7rem 1rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem 0.8rem;
}

.toolbar .brand {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--ink);
    margin-right: 0.2rem;
    white-space: nowrap;
}

.toolbar .brand i {
    color: var(--accent);
    font-size: 1.05rem;
}

.toolbar .spacer { flex: 1; }

.btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    border: 1px solid var(--dash);
    background: #fff;
    color: var(--ink-2);
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 0.42rem 0.85rem;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.14s ease;
    white-space: nowrap;
}

.btn:hover { border-color: #bfdbfe; background: #f8fbff; color: #1d4ed8; }
.btn i { font-size: 0.78rem; }

.btn.primary {
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 6px 14px -8px rgba(59,130,246,0.9);
}
.btn.primary:hover { color: #fff; filter: brightness(1.05); }

.btn.active {
    background: #fff7ed;
    border-color: #fdba74;
    color: #c2410c;
}

.btn.ghost { background: transparent; }

.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* 完成度 */
.completion {
    display: none;
    align-items: center;
    gap: 0.55rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink-3);
    min-width: 190px;
}

.completion.show { display: flex; }

.completion .cbar {
    flex: 1;
    height: 7px;
    background: var(--dash);
    border-radius: 999px;
    overflow: hidden;
    min-width: 70px;
}

.completion .cfill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #34d399, #10b981);
    transition: width 0.3s ease;
}

.completion .cnum { font-variant-numeric: tabular-nums; color: var(--ink); }

/* ============ 档案主体 ============ */
.character-sheet {
    max-width: 1300px;
    width: 100%;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(8px);
    border-radius: 2.5rem;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.6) inset;
    padding: 2rem 2rem 2.5rem;
}

.character-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1.6rem;
    margin-bottom: 2.2rem;
    padding-bottom: 1.8rem;
    border-bottom: 2px dashed #cbd5e1;
}

.avatar-placeholder {
    width: 90px;
    height: 90px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border-radius: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.8rem;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 12px 18px -8px rgba(59,130,246,0.5);
    flex-shrink: 0;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
}

.title-section { flex: 1; min-width: 260px; }

.title-section h1 {
    font-size: 2.35rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink);
    line-height: 1.2;
    margin-bottom: 0.35rem;
}

.subhead {
    font-size: 0.95rem;
    color: var(--ink-3);
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.4rem;
    align-items: center;
}

.subhead i { margin-right: 0.35rem; color: var(--accent); width: 1.05rem; }

.badge-group { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem; }

.badge {
    background: #e2e8f0;
    color: #1e293b;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 0.24rem 0.85rem;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    border: 1px solid #fff;
}

.badge i { font-size: 0.72rem; color: var(--accent); }

.header-metrics {
    display: grid;
    grid-template-columns: repeat(4, minmax(72px, 1fr));
    gap: 0.6rem;
    min-width: 300px;
}

.metric-chip {
    background: #ffffffcc;
    border: 1px solid #fff;
    border-radius: 1.1rem;
    padding: 0.6rem 0.7rem;
    text-align: center;
    box-shadow: 0 6px 14px -10px rgba(15,23,42,0.35);
}

.metric-chip .metric-value {
    font-size: 1.12rem;
    font-weight: 700;
    color: #0b1e33;
    line-height: 1.1;
}

.metric-chip .metric-label {
    font-size: 0.66rem;
    color: var(--ink-3);
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-top: 0.15rem;
}

.data-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    align-items: start;
}

.col-stack { display: flex; flex-direction: column; gap: 1.6rem; }

.data-card {
    background: #ffffffd9;
    backdrop-filter: blur(4px);
    border-radius: 1.8rem;
    padding: 1.6rem 1.7rem 1.7rem;
    box-shadow: 0 10px 20px -10px rgba(0,0,0,0.08), 0 0 0 1px rgba(255,255,255,0.8) inset;
    border: 1px solid #fff;
}

.card-header {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 1.3rem;
    border-bottom: 1px solid var(--line);
    padding-bottom: 0.85rem;
}

.card-header i {
    font-size: 1.4rem;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 1rem;
    width: 2.5rem;
    height: 2.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.card-header h2 {
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #0b1e33;
    flex: 1;
}

.card-meta {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--ink-3);
    background: #f1f5f9;
    border-radius: 999px;
    padding: 0.2rem 0.7rem;
    white-space: nowrap;
}

/* ============ 字段行 ============ */
.stats-list { display: flex; flex-direction: column; gap: 0.95rem; }

.stat-row {
    display: flex;
    align-items: flex-start;
    font-size: 0.95rem;
    line-height: 1.45;
    border-bottom: 1px dashed var(--dash);
    padding-bottom: 0.75rem;
    gap: 0.5rem;
}

.stat-row:last-child { border-bottom: none; padding-bottom: 0; }

.stat-label {
    font-weight: 600;
    color: var(--ink-2);
    width: 132px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 0.45rem;
    padding-top: 0.15rem;
}

.stat-label i { color: var(--ink-3); font-size: 0.88rem; width: 1.15rem; text-align: center; }

.stat-value {
    font-weight: 400;
    color: var(--ink);
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem 0.7rem;
    min-width: 0;
}

.stat-value strong { font-weight: 700; color: #0b1e33; }

.unit {
    font-size: 0.76rem;
    color: var(--ink-3);
    font-weight: 500;
    background: #f1f5f9;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    white-space: nowrap;
}

.note {
    font-size: 0.76rem;
    color: var(--ink-3);
    font-style: italic;
}

/* ============ 编辑态控件 ============ */
.field {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 0.55rem;
    align-items: center;
}

.edit-mode .view-only { display: none !important; }
.field .edit-only { display: none; }
.edit-mode .field .edit-only { display: inline-flex; }

.inp {
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--ink);
    background: #fff;
    border: 1px solid #dbe3ec;
    border-radius: 0.6rem;
    padding: 0.3rem 0.55rem;
    min-width: 0;
    width: 100%;
    transition: border-color 0.14s, box-shadow 0.14s;
}

.inp:focus {
    outline: none;
    border-color: #93c5fd;
    box-shadow: 0 0 0 3px rgba(147,197,253,0.28);
}

.inp.nano { width: 5.2rem; flex: 0 0 auto; }
.inp.tiny { width: 7rem; flex: 0 0 auto; }
.inp.small { width: 9.5rem; flex: 0 0 auto; }
.inp.auto { width: auto; flex: 1 1 8rem; }

.inp[type="number"] { -moz-appearance: textfield; }
.inp[type="number"]::-webkit-outer-spin-button,
.inp[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

textarea.inp { resize: vertical; min-height: 3.4rem; line-height: 1.5; }

select.inp { cursor: pointer; }

.mini-lbl {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--ink-4);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    flex: 0 0 auto;
}

/* 标签编辑 */
.tag-editor {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    align-items: center;
    width: 100%;
}

.hobby-tag {
    background: #eef2ff;
    color: #4338ca;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 0.2rem 0.55rem 0.2rem 0.8rem;
    border-radius: 999px;
    border: 1px solid #c7d2fe;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
}

.hobby-tag .x {
    cursor: pointer;
    color: #818cf8;
    font-size: 0.72rem;
    line-height: 1;
    padding: 0.1rem;
    border-radius: 50%;
}

.hobby-tag .x:hover { color: var(--danger); background: #fee2e2; }

.tag-add {
    font-family: inherit;
    font-size: 0.78rem;
    border: 1px dashed #c7d2fe;
    background: #f8faff;
    color: #6366f1;
    border-radius: 999px;
    padding: 0.18rem 0.7rem;
    cursor: pointer;
    font-weight: 600;
}

.tag-add:hover { background: #eef2ff; }

/* ============ 生命体征高亮 ============ */
.vital-highlight {
    background: #f0f9ff;
    border-radius: 1.6rem;
    padding: 0.8rem 1.1rem;
    margin-top: 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.7rem 1.6rem;
    border: 1px solid #b8dfff;
}

.vital-item { display: flex; align-items: center; gap: 0.5rem; }
.vital-item i { font-size: 1.05rem; color: #0284c7; width: 1.5rem; }
.vital-item span { font-weight: 600; color: #0369a1; font-size: 0.92rem; }
.vital-item .small-unit { font-size: 0.76rem; color: var(--accent); font-weight: 400; }

/* ============ 进度条 ============ */
.bar-group { display: flex; flex-direction: column; gap: 0.85rem; }

.bar-item .bar-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.82rem;
    margin-bottom: 0.3rem;
}

.bar-item .bar-top > span:first-child { font-weight: 600; color: var(--ink-2); }

.bar-track { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }

.bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #60a5fa, #3b82f6); transition: width 0.35s ease; }
.bar-fill.green { background: linear-gradient(90deg, #6ee7b7, #10b981); }
.bar-fill.amber { background: linear-gradient(90deg, #fcd34d, #f59e0b); }
.bar-fill.violet { background: linear-gradient(90deg, #c4b5fd, #8b5cf6); }
.bar-fill.rose { background: linear-gradient(90deg, #fda4af, #f43f5e); }

.bar-scale {
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
    font-size: 0.68rem;
    color: var(--ink-4);
    margin-top: 0.28rem;
}

/* ============ 图表 ============ */
.chart-wrap {
    background: #f8fafc;
    border: 1px solid var(--line);
    border-radius: 1.2rem;
    padding: 0.9rem 1rem 0.7rem;
    margin-top: 1rem;
}

.chart-title {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.78rem;
    font-weight: 600;
    color: #475569;
    margin-bottom: 0.7rem;
}

.chart-title em { font-style: normal; font-size: 0.68rem; font-weight: 500; color: var(--ink-4); }

.bar-chart { display: flex; align-items: flex-end; gap: 0.4rem; height: 96px; }

.bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
    gap: 0.3rem;
}

.bar-col .bar {
    width: 100%;
    max-width: 26px;
    border-radius: 6px 6px 3px 3px;
    background: linear-gradient(180deg, #93c5fd, #3b82f6);
    min-height: 3px;
    transition: height 0.35s ease;
}

.bar-col.hot .bar { background: linear-gradient(180deg, #fdba74, #f97316); }
.bar-col .bar-val { font-size: 0.6rem; font-weight: 700; color: #475569; }
.bar-col .bar-day { font-size: 0.64rem; color: var(--ink-4); font-weight: 600; }

/* ============ 表格 ============ */
.table-scroll { width: 100%; overflow-x: auto; }

.mini-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }

.mini-table th {
    text-align: left;
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 700;
    padding: 0 0.45rem 0.5rem;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
}

.mini-table td {
    padding: 0.5rem 0.45rem;
    border-bottom: 1px dashed #eef2f7;
    color: var(--ink);
    vertical-align: middle;
}

.mini-table tbody tr:last-child td { border-bottom: none; }
.mini-table td:first-child { font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.mini-table td.num { font-variant-numeric: tabular-nums; font-weight: 600; }

.mini-table .row-del {
    background: none;
    border: none;
    color: #cbd5e1;
    cursor: pointer;
    font-size: 0.8rem;
    padding: 0.1rem 0.3rem;
}

.mini-table .row-del:hover { color: var(--danger); }
.mini-table .edit-only { display: none; }
.edit-mode .mini-table .edit-only { display: table-cell; }

.row-add {
    margin-top: 0.7rem;
    width: 100%;
    border: 1px dashed #dbe3ec;
    background: #fbfdff;
    color: var(--accent);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    border-radius: 0.7rem;
    padding: 0.45rem;
    cursor: pointer;
}

.row-add:hover { background: var(--accent-soft); border-color: #bfdbfe; }
.edit-mode .row-add { display: block; }
.row-add { display: none; }

.pill {
    display: inline-block;
    font-size: 0.66rem;
    font-weight: 700;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    letter-spacing: 0.02em;
    white-space: nowrap;
}

.pill.ok { background: #dcfce7; color: #15803d; }
.pill.warn { background: #fef3c7; color: #b45309; }
.pill.info { background: #e0e7ff; color: #4338ca; }
.pill.mute { background: #f1f5f9; color: #475569; }
.pill.danger { background: #fee2e2; color: #b91c1c; }

/* ============ 评分点阵 ============ */
.rating-row { display: flex; align-items: center; gap: 0.65rem; font-size: 0.84rem; }

.rating-row .rating-name { width: 84px; flex-shrink: 0; font-weight: 600; color: var(--ink-2); }

.rating-dots { display: flex; gap: 0.16rem; flex: 1; }

.rating-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dash); }
.rating-dot.on { background: var(--accent); }
.rating-dot.on.high { background: var(--ok); }

.rating-row .rating-num {
    font-size: 0.74rem;
    font-weight: 700;
    color: var(--ink-3);
    width: 2.3rem;
    text-align: right;
    font-variant-numeric: tabular-nums;
}

/* 滑杆（编辑态评分） */
.score-slider { width: 100%; accent-color: var(--accent); cursor: pointer; }

/* ============ 时间线 ============ */
.timeline { display: flex; flex-direction: column; }

.tl-item { display: flex; gap: 0.85rem; font-size: 0.84rem; position: relative; padding-bottom: 0.95rem; }
.tl-item:last-child { padding-bottom: 0; }

.tl-time {
    width: 50px;
    flex-shrink: 0;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    font-size: 0.8rem;
    padding-top: 0.1rem;
}

.tl-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #93c5fd;
    flex-shrink: 0;
    margin-top: 0.28rem;
    position: relative;
    z-index: 1;
}

.tl-item:not(:last-child) .tl-dot::after {
    content: '';
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: calc(100% + 0.8rem);
    background: var(--dash);
}

.tl-dot.done { background: var(--accent); border-color: var(--accent); }

.tl-body { flex: 1; color: var(--ink-2); line-height: 1.4; min-width: 0; }
.tl-body strong { color: #0b1e33; font-weight: 600; }
.tl-body .tl-note { display: block; font-size: 0.74rem; color: var(--ink-4); margin-top: 0.1rem; }

/* ============ 分区标题 / 页脚 ============ */
.section-divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 2.2rem 0 1.4rem;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-4);
}

.section-divider::before,
.section-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #cbd5e1, transparent);
}

.trend-foot {
    margin-top: 1.2rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.9rem;
    font-size: 0.78rem;
    justify-content: flex-end;
    color: #4b5563;
    border-top: 1px solid var(--dash);
    padding-top: 0.9rem;
}

.triple-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6rem; align-items: start; }

/* ============ 提示条 ============ */
.toast {
    position: fixed;
    bottom: 1.6rem;
    left: 50%;
    transform: translate(-50%, 1.6rem);
    background: rgba(15,23,42,0.92);
    color: #fff;
    font-size: 0.82rem;
    font-weight: 500;
    padding: 0.6rem 1.1rem;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.22s ease;
    z-index: 300;
    box-shadow: 0 12px 28px -12px rgba(0,0,0,0.5);
}

.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ============ 打印 ============ */
@media print {
    body { background: #fff; padding: 0; }
    .toolbar, .row-add, .row-del, .tag-add, .tag-add-btn { display: none !important; }

const STORE_KEY = 'character_profile_v1';
let DATA = defaults();
let editMode = false;

function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

/* 把 schema 转成「纯数据」，键路径与 schema 一一对应 */
function defaults() {
    const header = {
        avatar: SCHEMA.header.avatar,
        name: SCHEMA.header.name,
        subhead: SCHEMA.header.subhead.map(s => ({ value: s.d })),
        badges: SCHEMA.header.badges.map(b => ({ value: b.d })),
        metrics: SCHEMA.header.metrics.map(m => ({ value: m.value, label: m.label }))
    };

    const card = (c) => {
        const o = {};
        if (c.rows) {
            o.rows = {};
            c.rows.forEach(r => {
                o.rows[r.key] = deepClone(r.d);
                o.rows[r.key + '__extra'] = r.extra || '';
            });
        }
        if (c.vitals) o.vitals = c.vitals.map(v => ({ value: v.value }));
        if (c.bars) o.bars = c.bars.map(b => ({ value: b.value, pct: b.pct }));
        if (c.ratings) o.ratings = c.ratings.map(r => ({ value: r.d }));
        if (c.table) o[c.table.key] = { rows: c.table.rows.map(r => r.slice()) };
        if (c.chart) o[c.chart.key] = { values: c.chart.values.slice() };
        if (c.timeline) o.timeline = { rows: c.timeline.rows.map(r => r.slice()) };
        return o;
    };

    return {
        header,
        left: SCHEMA.left.map(card),
        right: SCHEMA.right.map(card),
        triple: SCHEMA.triple.map(card),
        sources: { rows: SCHEMA.sources.rows.map(r => r.slice()) }
    };
}

/* 按点路径读写 */
function getPath(obj, path) {
    return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
}
function setPath(obj, path, val) {
    const parts = path.split('.');
    const last = parts.pop();
    const tgt = parts.reduce((o, k) => (o[k] = o[k] ?? {}), obj);
    tgt[last] = val;
}

/* =========================================================================
   工具
   ========================================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

function pillClass(v) {
    const s = String(v);
    if (/优秀|完成|达标|在线|已同步|正常|完整|合格|顶尖/.test(s)) return 'ok';
    if (/超|偏高|紧张|连续|待|注意/.test(s)) return 'warn';
    if (/危险|异常|失败|禁用/.test(s)) return 'danger';
    if (/今日|高权限|顶尖/.test(s)) return 'info';
    return 'mute';
}

/* =========================================================================
   渲染：通用字段行
   ========================================================================= */
function renderRow(row, base) {
    const path = `${base}.${row.key}`;
    const val = getPath(DATA, path);

    const view = rowView(row, val);
    const edit = rowEdit(row, path, val);

    return `<div class="stat-row">
        <span class="stat-label"><i class="fas ${row.icon}"></i> ${esc(row.label)}</span>
        <span class="stat-value">
            <span class="view-only" style="display:contents">${view}</span>
            <span class="field">${edit}</span>
        </span>
    </div>`;
}

function rowView(row, val) {
    const extra = row.extra ? `<span class="note">${esc(row.extra)}</span>` : '';
    switch (row.type) {
        case 'num':
            return `<strong>${esc(val)}</strong> <span class="unit">${esc(row.unit || '')}</span>${extra}`;
        case 'combo':
            return (Array.isArray(val) ? val : [val]).map(v => `<span>${esc(v)}</span>`).join('') + extra;
        case 'tags':
            return `<div class="hobby-tags">${(val || []).map(t => `<span class="hobby-tag">${esc(t)}</span>`).join('')}</div>`;
        case 'textarea':
            return `<span style="white-space:pre-wrap">${esc(val || '—')}</span>`;
        default:
            return `<span>${esc(val)}</span>${extra}`;
    }
}

function rowEdit(row, path, val) {
    const extraInp = `<input class="inp small edit-only" data-path="${path}__extra" value="${esc(row.extra || '')}" placeholder="备注">`;
    switch (row.type) {
        case 'num':
            return `<input class="inp nano edit-only" type="text" data-path="${path}" value="${esc(val)}">
                    <span class="unit">${esc(row.unit || '')}</span>${extraInp}`;
        case 'combo': {
            const arr = Array.isArray(val) ? val : [val];
            return arr.map((v, i) =>
                `<input class="inp auto edit-only" data-path="${path}.${i}" value="${esc(v)}"
                        placeholder="${esc(row.labels?.[i] || '值 ' + (i + 1))}">`).join('') + extraInp;
        }
        case 'tags':
            return `<div class="tag-editor edit-only" data-tagpath="${path}">
                        ${(val || []).map((t, i) => `<span class="hobby-tag">${esc(t)}<i class="fas fa-xmark x" data-tagdel="${path}.${i}"></i></span>`).join('')}
                        <button class="tag-add" data-tagadd="${path}">+ 添加</button>
                    </div>`;
        case 'textarea':
            return `<textarea class="inp edit-only" rows="2" data-path="${path}" placeholder="填写内容…">${esc(val || '')}</textarea>`;
        default:
            return `<input class="inp auto edit-only" data-path="${path}" value="${esc(val)}">${extraInp}`;
    }
}

/* =========================================================================
   渲染：卡片
   ========================================================================= */
function renderCard(card, base) {
    let inner = '';

    if (card.rows) {
        inner += `<div class="stats-list">${card.rows.map(r => renderRow(r, base)).join('')}</div>`;
    }

    if (card.vitals) {
        inner += `<div class="vital-highlight">${card.vitals.map((v, i) => `
            <div class="vital-item">
                <i class="fas ${v.icon}"></i>
                <span class="view-only">${esc(v.value)}</span>
                <input class="inp edit-only" data-path="${base}.vitals.${i}.value" value="${esc(v.value)}" style="width:6rem">
                <span class="small-unit">${esc(v.label)}</span>
            </div>`).join('')}</div>`;
    }

    if (card.bars) {
        inner += `<div class="bar-group">${card.bars.map((b, i) => `
            <div class="bar-item">
                <div class="bar-top">
                    <span>${esc(b.label)}</span>
                    <span class="view-only" style="font-weight:600;color:#0f172a">${esc(b.value)}</span>
                    <input class="inp tiny edit-only" data-path="${base}.bars.${i}.value" value="${esc(b.value)}">
                </div>
                <div class="bar-track"><div class="bar-fill ${b.color}" style="width:${Math.max(0, Math.min(100, b.pct))}%"></div></div>
                <div class="bar-scale">${(b.scale || []).map(s => `<span>${esc(s)}</span>`).join('')}</div>
            </div>`).join('')}</div>`;
    }

    if (card.table) {
        inner += renderTable(card.table, base);
    }

    if (card.ratings) {
        inner += `<div class="stats-list" style="gap:0.7rem">${card.ratings.map((r, i) => {
            const v = Number(r.value ?? 0);
            const dots = Array.from({ length: 10 }, (_, k) =>
                `<i class="rating-dot ${k < Math.round(v) ? 'on' : ''} ${k < Math.round(v) && v >= 8.5 ? 'high' : ''}"></i>`).join('');
            return `<div class="rating-row">
                <span class="rating-name">${esc(r.label)}</span>
                <span class="rating-dots view-only">${dots}</span>
                <input class="score-slider edit-only" type="range" min="0" max="10" step="0.1"
                       data-path="${base}.ratings.${i}.value" value="${v}">
                <span class="rating-num">${v.toFixed(1)}</span>
            </div>`;
        }).join('')}</div>`;
    }

    if (card.chart) {
        inner += renderChart(card.chart, base);
    }

    if (card.timeline) {
        inner += `<div class="timeline">${card.timeline.rows.map((r, i) => `
            <div class="tl-item">
                <span class="tl-time">
                    <span class="view-only">${esc(r.time)}</span>
                    <input class="inp edit-only" data-path="${base}.timeline.rows.${i}.time" value="${esc(r.time)}" style="width:3.6rem">
                </span>
                <span class="tl-dot ${r.done ? 'done' : ''}"></span>
                <div class="tl-body">
                    <strong class="view-only">${esc(r.title)}</strong>
                    <input class="inp edit-only" data-path="${base}.timeline.rows.${i}.title" value="${esc(r.title)}">
                    <span class="tl-note view-only">${esc(r.note)}</span>
                    <input class="inp edit-only" data-path="${base}.timeline.rows.${i}.note" value="${esc(r.note)}" placeholder="备注">
                </div>
            </div>`).join('')}</div>`;
    }

    if (card.trend) {
        inner += `<div class="trend-foot">${card.trend.map(t =>
            `<span><i class="fas fa-arrow-trend-${t.dir}" style="color:${t.dir === 'up' ? '#10b981' : '#ef4444'}"></i> ${esc(t.text)}</span>`
        ).join('')}</div>`;
    }

    return `<div class="data-card">
        <div class="card-header">
            <i class="fas ${card.icon}"></i>
            <h2>${esc(card.title)}</h2>
            ${card.meta ? `<span class="card-meta">${esc(card.meta)}</span>` : ''}
        </div>
        ${inner}
    </div>`;
}

   渲染：表格
   ========================================================================= */
function renderTable(t, base) {
    const rows = t.rows.map((r, i) => {
        const cells = t.cols.map((c, j) => {
            const v = r[c.title] ?? r[j] ?? '';
            if (c.type === 'pill') {
                return `<td>
                    <span class="pill ${pillClass(v)} view-only">${esc(v)}</span>
                    <input class="inp edit-only" data-path="${base}.${t.key}.rows.${i}.${j}" value="${esc(v)}" style="width:5rem">
                </td>`;
            }
            const cls = /成绩|摄入|目标|时长|数值/.test(c.title) ? 'num' : '';
            return `<td class="${cls}">
                <span class="view-only">${esc(v)}</span>
                <input class="inp edit-only" data-path="${base}.${t.key}.rows.${i}.${j}" value="${esc(v)}">

        }).join('');
        return `<tr>${cells}
            <td class="edit-only" style="width:2rem">
                <button class="row-del" data-rowdel="${base}.${t.key}.rows.${i}" title="删除本行"><i class="fas fa-xmark"></i></button>

    }).join('');

            <thead><tr>${t.cols.map(c => `<th>${esc(c.title)}</th>`).join('')}<th class="edit-only"></th></tr></thead>

        <i class="fas fa-plus"></i> 添加一行
    </button>`;
}

/* =========================================================================
   渲染：周柱状图
   ========================================================================= */
function renderChart(c, base) {
    const max = c.max || 10;
    const bars = c.values.map((v, i) => {
        const pct = Math.max(2, Math.min(100, (v / max) * 100));
        const hot = v >= max * 0.92;
        return `<div class="bar-col ${hot ? 'hot' : ''}">
            <span class="bar-val">${v}</span>
            <div class="bar" style="height:${pct}%"></div>
            <span class="bar-day">${esc(c.days[i])}</span>
        </div>`;
    }).join('');

    const editRow = c.values.map((v, i) =>
        `<input class="inp nano edit-only" type="number" step="0.1" data-path="${base}.${c.key}.values.${i}" value="${v}" title="${esc(c.days[i])}">`
    ).join('');

    return `<div class="chart-wrap">
        <div class="chart-title"><span>${esc(c.title)}</span><em>目标 ${esc(c.goal)}${esc(c.unit || '')}</em></div>
        <div class="bar-chart view-only">${bars}</div>
        <div class="field edit-only" style="gap:0.3rem">${editRow}</div>
    </div>`;
}

/* 把 DATA 里的值合并进 schema 结构，便于渲染 */
function withData(card) {
    const out = deepClone(card);
    const base = findBase(card);
    const d = getPath(DATA, base);
    if (!d) return out;

    if (out.rows && d.rows) {
        out.rows.forEach(r => {
            r.value = d.rows[r.key];
            if (r.key + '__extra' in d.rows) r.extra = d.rows[r.key + '__extra'];
        });
    }
    if (out.vitals && d.vitals) out.vitals.forEach((v, i) => v.value = d.vitals[i]?.value ?? v.value);
    if (out.bars && d.bars) out.bars.forEach((b, i) => {
        if (d.bars[i]) { b.value = d.bars[i].value; b.pct = d.bars[i].pct ?? b.pct; }
    });
    if (out.ratings && d.ratings) out.ratings.forEach((r, i) => r.value = d.ratings[i]?.value ?? r.value);
    if (out.table && d[out.table.key]) out.table.rows = d[out.table.key].rows;
    if (out.chart && d[out.chart.key]) out.chart.values = d[out.chart.key].values;
    if (out.timeline && d.timeline) {
        out.timeline.rows = d.timeline.rows.map(r => ({ time: r[0], title: r[1], note: r[2], done: r[3] }));
    }
    return out;
}

function findBase(card) {
    const find = list => list.findIndex(c => c.id === card.id);
    let i = find(SCHEMA.left);
    if (i >= 0) return `left.${i}`;
    i = find(SCHEMA.right);
    if (i >= 0) return `right.${i}`;
    i = find(SCHEMA.triple);
    if (i >= 0) return `triple.${i}`;
    return '';
}

            <button class="row-del" data-rowdel="sources.rows.${i}"><i class="fas fa-xmark"></i></button></td></tr>`;
    }).join('');

    $('#sourceStack').innerHTML = `<div class="data-card">
        <div class="card-header"><i class="fas ${s.icon}"></i><h2>${esc(s.title)}</h2>
            <span class="card-meta">${esc(s.meta)}</span></div>

            <i class="fas fa-plus"></i> 添加一行
        </button>
    </div>`;
}

/* =========================================================================
   输入绑定
   ========================================================================= */
function bindInputs() {
    $$('[data-path]').forEach(el => {
        if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
            el.addEventListener('input', e => {
                const p = e.target.dataset.path;
                if (!p) return;
                const v = e.target.value;
                setPath(DATA, p, e.target.type === 'range' ? Number(v) : v);
                saveSoon();
                if (e.target.type === 'range') {
                    const numEl = e.target.closest('.rating-row').querySelector('.rating-num');
                    if (numEl) numEl.textContent = Number(v).toFixed(1);
                }
            });
        }
    });

    $$('[data-tagdel]').forEach(el => el.addEventListener('click', e => {
        const p = e.currentTarget.dataset.tagdel;
        const arr = getPath(DATA, p);
        const parts = p.split('.');
        const idx = parts.pop();
        const parent = getPath(DATA, parts.join('.'));
        parent.splice(Number(idx), 1);
        saveSoon();
        render();
    }));

    $$('[data-tagadd]').forEach(el => el.addEventListener('click', e => {
        const p = e.currentTarget.dataset.tagadd;
        const v = prompt('新增标签');
        if (!v) return;
        const arr = getPath(DATA, p);
        arr.push(v.trim());
        saveSoon();
        render();
    }));

    $$('[data-rowdel]').forEach(el => el.addEventListener('click', e => {
        const p = e.currentTarget.dataset.rowdel;
        const parts = p.split('.');
        parts.pop();
        const parent = getPath(DATA, parts.join('.'));
        if (parent.length <= 1) return toast('至少保留一行');
        parent.splice(Number(p.split('.').pop()), 1);
        saveSoon();
        render();
    }));

    $$('[data-rowadd]').forEach(el => el.addEventListener('click', e => {
        const p = e.currentTarget.dataset.rowadd;
        const n = Number(e.currentTarget.dataset.colcount || 4);
        const arr = getPath(DATA, p);
        arr.push(Array.from({ length: n }, () => ''));
        saveSoon();
        render();
    }));
}

/* =========================================================================
   完成度
   ========================================================================= */
function collectFields() {
    const out = [];
    const walk = (o, path) => {
        if (Array.isArray(o)) {
            o.forEach((v, i) => walk(v, `${path}.${i}`));
        } else if (o && typeof o === 'object') {
            for (const k in o) walk(o[k], path ? `${path}.${k}` : k);
        } else {
            if (path) out.push({ path, v: o });
        }
    };
    walk(DATA, '');
    return out;
}

function updateCompletion() {
    const fields = collectFields();
    const filled = fields.filter(f => f.v !== '' && f.v != null).length;
    const pct = fields.length ? Math.round((filled / fields.length) * 100) : 0;
    $('#cfill').style.width = pct + '%';
    $('#cnum').textContent = pct + '%';
}

/* =========================================================================
   存储
   ========================================================================= */
let saveTimer = null;
function saveSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 500);
}

function save(quiet) {
    try {
        localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
        if (!quiet) toast('已保存到本地');
    } catch (e) {
        toast('保存失败：' + e.message);
    }
}

function load() {
    try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return false;
        const obj = JSON.parse(raw);
        DATA = mergeDeep(defaults(), obj);
        return true;
    } catch (e) {
        return false;
    }
}

function mergeDeep(base, patch) {
    if (Array.isArray(base)) {
        if (Array.isArray(patch)) return patch.length ? patch : base;
        return base;
    }
    if (base && typeof base === 'object' && patch && typeof patch === 'object') {
        for (const k in patch) {
            base[k] = k in base ? mergeDeep(base[k], patch[k]) : patch[k];
        }
        return base;
    }
    return patch === undefined ? base : patch;
}

/* =========================================================================
   工具栏交互
   ========================================================================= */
$('#btnEdit').addEventListener('click', () => {
    editMode = !editMode;
    $('#btnEdit').classList.toggle('active', editMode);
    $('#btnEdit').innerHTML = editMode
        ? '<i class="fas fa-eye"></i> <span>预览模式</span>'
        : '<i class="fas fa-pen-to-square"></i> <span>填写模式</span>';
    $('#completion').classList.toggle('show', editMode);
    if (!editMode) save(true);
    render();
    toast(editMode ? '填写模式：所有数值可编辑' : '预览模式');
});

$('#btnSave').addEventListener('click', () => { save(); });

$('#btnExport').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `character-${(DATA.header.name || 'profile').replace(/\s+/g, '_')}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('已导出 JSON');
});

$('#btnImport').addEventListener('click', () => $('#fileInput').click());

$('#fileInput').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
        try {
            const obj = JSON.parse(rd.result);
            DATA = mergeDeep(defaults(), obj);
            save(true);
            render();
            toast('导入成功');
        } catch (err) {
            toast('导入失败：JSON 格式错误');
        }
    };
    rd.readAsText(f);
    e.target.value = '';
});

$('#btnPrint').addEventListener('click', () => {
    if (editMode) {
        editMode = false;
        $('#btnEdit').classList.remove('active');
        $('#btnEdit').innerHTML = '<i class="fas fa-pen-to-square"></i> <span>填写模式</span>';
        $('#completion').classList.remove('show');
        render();
    }
    setTimeout(() => window.print(), 120);
});

$('#btnReset').addEventListener('click', () => {
    if (!confirm('确定清空所有自定义数据，恢复到模板默认值？')) return;
    localStorage.removeItem(STORE_KEY);
    DATA = defaults();
    render();
    toast('已重置为模板默认值');
});

/* 快捷键 */
document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); save(); }
    if (e.key === 'Escape' && editMode) $('#btnEdit').click();
});

/* =========================================================================
   启动
   ========================================================================= */
load();
render();
if (editMode === false) $('#completion').classList.remove('show');
</script>
</body>
