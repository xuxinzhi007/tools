<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接口场景测试</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #fff; color: #1f2329; height: 100vh; overflow: hidden; font-size: 14px; }

.app { display: flex; height: 100vh; }

/* 侧边栏 */
.sidebar { width: 260px; background: #f7f8fa; border-right: 1px solid #e5e6eb; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5e6eb; background: #fff; }
.sidebar-header .logo { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.sidebar-actions { display: flex; gap: 4px; }
.icon-btn { width: 28px; height: 28px; border: none; background: transparent; cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #4e5969; }
.icon-btn:hover { background: #f2f3f5; }
.sidebar .new-btn { margin: 10px 12px; }
.sidebar .new-btn button { width: 100%; padding: 7px 12px; background: #3370ff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
.sidebar .new-btn button:hover { background: #2964e8; }
.tree { flex: 1; overflow-y: auto; padding: 4px 8px; }

.tree-item { padding: 6px 8px; cursor: pointer; border-radius: 4px; display: flex; align-items: center; gap: 6px; font-size: 13px; user-select: none; line-height: 1.5; }
.tree-item:hover { background: #eef0f3; }
.tree-item.active { background: #e8f3ff; color: #3370ff; }
.tree-item .arrow { width: 14px; color: #86909c; font-size: 10px; flex-shrink: 0; text-align: center; transition: transform 0.2s; }
.tree-item.expanded .arrow { transform: rotate(90deg); }
.tree-item .method { font-family: monospace; font-size: 11px; font-weight: 600; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; }
.tree-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-item .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.tree-item .status-dot.pass { background: #00b42a; }
.tree-item .status-dot.fail { background: #f53f3f; }
.tree-item .status-dot.none { background: #c9cdd4; }
.tree-children { padding-left: 14px; }
.project-item { font-weight: 600; color: #1f2329; margin-top: 4px; }
.api-item { color: #4e5969; }
.scenario-item { padding-left: 28px !important; color: #4e5969; font-size: 12px; }
.scenario-item .method { display: none; }

.method-get { background: #e8f3ff; color: #3370ff; }
.method-post { background: #e8ffea; color: #00b42a; }
.method-put { background: #fff7e8; color: #ff7d00; }
.method-delete { background: #ffece8; color: #f53f3f; }
.method-patch { background: #f2f3f5; color: #86909c; }

/* 主内容区 */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* 顶部栏 */
.topbar { padding: 12px 20px; border-bottom: 1px solid #e5e6eb; display: flex; align-items: center; gap: 12px; background: #fff; }
.breadcrumb { font-size: 13px; color: #4e5969; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.breadcrumb .sep { margin: 0 6px; color: #c9cdd4; }

/* 场景头部 */
.scene-header { padding: 16px 20px; border-bottom: 1px solid #e5e6eb; background: #fff; }
.scene-title-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.scene-name { font-size: 16px; font-weight: 600; flex: 1; border: 1px solid transparent; padding: 4px 8px; border-radius: 4px; outline: none; }
.scene-name:hover { border-color: #e5e6eb; }
.scene-name:focus { border-color: #3370ff; background: #fff; }
.run-btn { padding: 8px 20px; background: #00b42a; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.run-btn:hover { background: #009a29; }
.run-btn:disabled { background: #c9cdd4; cursor: not-allowed; }

.url-row { display: flex; align-items: center; gap: 0; border: 1px solid #e5e6eb; border-radius: 4px; overflow: hidden; }
.url-row .method-select { padding: 8px 12px; border: none; border-right: 1px solid #e5e6eb; background: #f7f8fa; font-size: 13px; font-weight: 600; font-family: monospace; outline: none; cursor: pointer; }
.url-row .url-input { flex: 1; padding: 8px 12px; border: none; outline: none; font-size: 13px; font-family: monospace; }
.url-row .url-input:focus { background: #f7f8fa; }

/* Tab 切换 */
.tabs { display: flex; border-bottom: 1px solid #e5e6eb; padding: 0 20px; background: #fff; flex-shrink: 0; }
.tab { padding: 10px 16px; cursor: pointer; font-size: 13px; color: #4e5969; border-bottom: 2px solid transparent; transition: all 0.15s; }
.tab:hover { color: #3370ff; }
.tab.active { color: #3370ff; border-bottom-color: #3370ff; font-weight: 500; }

/* 内容区 */
.content { flex: 1; overflow-y: auto; padding: 16px 20px; background: #fff; }

/* 表单 */
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 13px; color: #4e5969; margin-bottom: 6px; font-weight: 500; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 8px 12px; border: 1px solid #e5e6eb; border-radius: 4px; font-size: 13px; color: #1f2329; outline: none; transition: border-color 0.15s;
  font-family: inherit;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #3370ff; }
.form-group textarea { resize: vertical; min-height: 120px; font-family: "SF Mono", Monaco, Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.6; }

/* JSON编辑器样式 */
.json-editor { border: 1px solid #e5e6eb; border-radius: 4px; overflow: hidden; }
.json-editor textarea { width: 100%; min-height: 200px; padding: 12px; border: none; outline: none; font-family: "SF Mono", Monaco, Consolas, monospace; font-size: 12px; line-height: 1.6; resize: vertical; }
.json-editor .toolbar { padding: 6px 10px; background: #f7f8fa; border-bottom: 1px solid #e5e6eb; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #86909c; }
.json-editor .toolbar .actions { display: flex; gap: 8px; }
.json-editor .toolbar button { padding: 2px 8px; font-size: 12px; border: 1px solid #e5e6eb; background: #fff; border-radius: 3px; cursor: pointer; color: #4e5969; }
.json-editor .toolbar button:hover { border-color: #3370ff; color: #3370ff; }
.json-editor.invalid { border-color: #f53f3f; }
.json-editor .hint { padding: 4px 10px; background: #ffece8; color: #f53f3f; font-size: 12px; }

/* 键值对编辑器 */
.kv-editor { border: 1px solid #e5e6eb; border-radius: 4px; overflow: hidden; }
.kv-row { display: flex; gap: 0; border-bottom: 1px solid #f2f3f5; }
.kv-row:last-child { border-bottom: none; }
.kv-row input { flex: 1; padding: 8px 10px; border: none; border-right: 1px solid #f2f3f5; font-size: 13px; outline: none; }
.kv-row input:focus { background: #f7f8fa; }
.kv-row input:last-of-type { border-right: none; }
.kv-row .del-btn { width: 32px; border: none; background: transparent; cursor: pointer; color: #c9cdd4; font-size: 14px; }
.kv-row .del-btn:hover { color: #f53f3f; background: #ffece8; }
.kv-add { padding: 6px 10px; background: #f7f8fa; text-align: center; cursor: pointer; font-size: 12px; color: #86909c; }
.kv-add:hover { color: #3370ff; background: #e8f3ff; }

/* 断言列表 */
.assertion-list { border: 1px solid #e5e6eb; border-radius: 4px; overflow: hidden; }
.assertion-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #f2f3f5; }
.assertion-item:last-child { border-bottom: none; }
.assertion-item select { padding: 6px 8px; border: 1px solid #e5e6eb; border-radius: 3px; font-size: 12px; outline: none; }
.assertion-item select:focus { border-color: #3370ff; }
.assertion-item .as-type { width: 110px; }
.assertion-item .as-path { flex: 1; padding: 6px 8px; border: 1px solid #e5e6eb; border-radius: 3px; font-size: 12px; outline: none; font-family: monospace; }
.assertion-item .as-path:focus { border-color: #3370ff; }
.assertion-item .as-value { flex: 1; padding: 6px 8px; border: 1px solid #e5e6eb; border-radius: 3px; font-size: 12px; outline: none; }
.assertion-item .as-value:focus { border-color: #3370ff; }
.assertion-item .del-btn { width: 28px; height: 28px; border: none; background: transparent; cursor: pointer; color: #c9cdd4; font-size: 14px; border-radius: 3px; }
.assertion-item .del-btn:hover { color: #f53f3f; background: #ffece8; }
.assertion-add { padding: 8px 10px; background: #f7f8fa; text-align: center; cursor: pointer; font-size: 12px; color: #86909c; }
.assertion-add:hover { color: #3370ff; background: #e8f3ff; }

/* 响应区域 */
.response-status { padding: 10px 14px; border-radius: 4px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; font-size: 13px; }
.response-status.success { background: #e8ffea; color: #009a29; }
.response-status.error { background: #ffece8; color: #cb2634; }
.response-status .code { font-weight: 600; font-family: monospace; font-size: 15px; }
.response-status .time { color: #86909c; margin-left: auto; }

.response-tabs { display: flex; gap: 0; border-bottom: 1px solid #e5e6eb; margin-bottom: 12px; }
.response-tab { padding: 8px 14px; cursor: pointer; font-size: 13px; color: #4e5969; border-bottom: 2px solid transparent; }
.response-tab.active { color: #3370ff; border-bottom-color: #3370ff; font-weight: 500; }

.response-body { background: #f7f8fa; border: 1px solid #e5e6eb; border-radius: 4px; padding: 14px; font-family: "SF Mono", Monaco, Consolas, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 500px; overflow-y: auto; line-height: 1.6; }

.assertion-results { margin-bottom: 14px; }
.assertion-result { padding: 8px 12px; border-radius: 4px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; font-size: 13px; background: #f7f8fa; }
.assertion-result.pass { color: #009a29; }
.assertion-result.fail { color: #cb2634; }
.assertion-result .icon { font-size: 14px; font-weight: bold; }
.assertion-result .detail { flex: 1; }
.assertion-result .actual { color: #86909c; font-size: 12px; margin-left: 8px; }

/* 空状态 */
.empty { text-align: center; padding: 80px 20px; color: #86909c; }
.empty .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
.empty p { font-size: 14px; margin-bottom: 6px; }
.empty .tip { font-size: 12px; color: #c9cdd4; }

/* 接口列表页 */
.api-list { }
.api-card { border: 1px solid #e5e6eb; border-radius: 6px; margin-bottom: 12px; overflow: hidden; }
.api-card-header { padding: 12px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; background: #fafbfc; }
.api-card-header:hover { background: #f5f6f7; }
.api-card-header .method { font-family: monospace; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 3px; }
.api-card-header .name { font-weight: 500; flex: 1; }
.api-card-header .path { font-family: monospace; font-size: 12px; color: #86909c; }
.api-card-header .count { font-size: 12px; color: #86909c; }
.api-card-body { padding: 0; }
.scenario-row { padding: 10px 16px 10px 40px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #f2f3f5; cursor: pointer; }
.scenario-row:hover { background: #f7f8fa; }
.scenario-row .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.scenario-row .status-dot.pass { background: #00b42a; }
.scenario-row .status-dot.fail { background: #f53f3f; }
.scenario-row .status-dot.none { background: #c9cdd4; }
.scenario-row .name { flex: 1; font-size: 13px; }
.scenario-row .desc { color: #86909c; font-size: 12px; flex: 1; }
.scenario-row .run-btn-small { padding: 4px 12px; font-size: 12px; background: #fff; border: 1px solid #e5e6eb; border-radius: 3px; cursor: pointer; color: #4e5969; }
.scenario-row .run-btn-small:hover { border-color: #00b42a; color: #00b42a; }

/* 项目页 */
.project-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.project-header h1 { font-size: 20px; font-weight: 600; }
.project-info { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 24px; }
.info-card { padding: 16px; border: 1px solid #e5e6eb; border-radius: 6px; }
.info-card h3 { font-size: 14px; margin-bottom: 12px; color: #1f2329; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stat-item { text-align: center; padding: 16px; background: #f7f8fa; border-radius: 4px; }
.stat-item .num { font-size: 24px; font-weight: 600; color: #3370ff; }
.stat-item .label { font-size: 12px; color: #86909c; margin-top: 4px; }

/* 右键菜单省略 */
.muted { color: #86909c; }
.small { font-size: 12px; }

/* 开关 */
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.switch input { display: none; }
.switch-slider { width: 36px; height: 20px; background: #c9cdd4; border-radius: 10px; position: relative; transition: background 0.2s; }
.switch-slider::before { content: ''; position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: left 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
.switch input:checked + .switch-slider { background: #00b42a; }
.switch input:checked + .switch-slider::before { left: 18px; }

/* 弹窗 */
.modal-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal { background: #fff; border-radius: 6px; width: 420px; max-width: 90vw; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
.modal-header { padding: 16px 20px; border-bottom: 1px solid #e5e6eb; font-size: 15px; font-weight: 600; }
.modal-body { padding: 20px; }
.modal-footer { padding: 12px 20px; border-top: 1px solid #e5e6eb; display: flex; justify-content: flex-end; gap: 10px; }
.btn { padding: 7px 16px; border: 1px solid #e5e6eb; background: #fff; border-radius: 4px; cursor: pointer; font-size: 13px; color: #4e5969; }
.btn:hover { color: #3370ff; border-color: #3370ff; }
.btn-primary { background: #3370ff; color: #fff; border-color: #3370ff; }
.btn-primary:hover { background: #2964e8; color: #fff; border-color: #2964e8; }
.btn-danger { background: #f53f3f; color: #fff; border-color: #f53f3f; }
.btn-danger:hover { background: #d9363e; color: #fff; border-color: #d9363e; }
.btn-small { padding: 4px 10px; font-size: 12px; }

/* 加载动画 */
.loading { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px; background: rgba(0,0,0,0.8); color: #fff; border-radius: 4px; font-size: 13px; z-index: 2000; animation: slideDown 0.3s ease; }
.toast.success { background: #00b42a; }
.toast.error { background: #f53f3f; }
@keyframes slideDown { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* 右键/上下文菜单 */
.ctx-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
.tree-item:hover .ctx-actions { opacity: 1; }
.ctx-actions button { width: 22px; height: 22px; border: none; background: transparent; cursor: pointer; border-radius: 3px; font-size: 12px; color: #86909c; display: flex; align-items: center; justify-content: center; }
.ctx-actions button:hover { background: #e5e6eb; color: #4e5969; }
</style>
</head>
<body>
<div class="app" id="app">
  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">🔬 场景测试</div>
      <div class="sidebar-actions">
        <button class="icon-btn" onclick="loadBuiltin()" title="加载内置场景（Episode 上报 mock）">🧩</button>
        <button class="icon-btn" onclick="exportData()" title="导出">📤</button>
        <button class="icon-btn" onclick="document.getElementById('importFile').click()" title="导入">📥</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      </div>
    </div>
    <div class="new-btn">
      <button onclick="addProject()">+ 新建项目</button>
    </div>
    <div class="tree" id="sidebarTree"></div>
  </div>

  <!-- 主内容 -->
  <div class="main">
    <div class="topbar">
      <div class="breadcrumb" id="breadcrumb">请选择项目</div>
      <div id="topbarActions"></div>
    </div>
    <div class="content" id="mainContent"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
const STORAGE_KEY = 'scenario_tester_v2';

let state = {
  projects: [],
  selected: { projectId: null, apiId: null, scenarioId: null },
  activeTab: 'request', // request | assert | response
  responseTab: 'body', // body | headers
  lastResults: {} // scenarioId -> result
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      state.projects = data.projects || [];
      state.lastResults = data.lastResults || {};
    }
  } catch (e) { console.warn('加载失败', e); }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      projects: state.projects,
      lastResults: state.lastResults
    }));
  } catch (e) { console.warn('保存失败', e); }
}

function findProject(id) { return state.projects.find(p => p.id === id); }
function findApi(pid, aid) { const p = findProject(pid); return p ? p.apis.find(a => a.id === aid) : null; }
function findScenario(pid, aid, sid) { const a = findApi(pid, aid); return a ? a.scenarios.find(s => s.id === sid) : null; }

function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.getElementById('toastRoot').appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

function renderSidebar() {
  const tree = document.getElementById('sidebarTree');
  let html = '';
  for (const p of state.projects) {
    const pActive = state.selected.projectId === p.id && !state.selected.apiId;
    const expanded = state.selected.projectId === p.id;
    html += `
      <div class="tree-item project-item ${pActive ? 'active' : ''} ${expanded ? 'expanded' : ''}" onclick="selectProject('${p.id}')">
        <span class="arrow">▶</span>
        <span class="name" title="${p.name}">${p.name}</span>
        <div class="ctx-actions">
          <button onclick="event.stopPropagation(); addApi('${p.id}')" title="添加接口">＋</button>
          <button onclick="event.stopPropagation(); editProject('${p.id}')" title="编辑">✎</button>
          <button onclick="event.stopPropagation(); deleteProject('${p.id}')" title="删除">🗑</button>
        </div>
      </div>
    `;
    if (expanded) {
      html += '<div class="tree-children">';
      for (const a of p.apis) {
        const aActive = state.selected.apiId === a.id && !state.selected.scenarioId;
        const aExpanded = state.selected.apiId === a.id;
        html += `
          <div class="tree-item api-item ${aActive ? 'active' : ''} ${aExpanded ? 'expanded' : ''}" onclick="selectApi('${p.id}', '${a.id}')">
            <span class="arrow">▶</span>
            <span class="method method-${a.method.toLowerCase()}">${a.method}</span>
            <span class="name" title="${a.name}">${a.name}</span>
            <div class="ctx-actions">
              <button onclick="event.stopPropagation(); addScenario('${p.id}', '${a.id}')" title="添加场景">＋</button>
              <button onclick="event.stopPropagation(); editApi('${p.id}', '${a.id}')" title="编辑">✎</button>
              <button onclick="event.stopPropagation(); deleteApi('${p.id}', '${a.id}')" title="删除">🗑</button>
            </div>
          </div>
        `;
        if (aExpanded) {
          html += '<div class="tree-children">';
          if (a.scenarios.length === 0) {
            html += '<div style="padding:6px 8px 6px 20px; font-size:12px; color:#c9cdd4;">暂无场景</div>';
          }
          for (const s of a.scenarios) {
            const sActive = state.selected.scenarioId === s.id;
            const res = state.lastResults[s.id];
            let dotClass = 'none';
            if (res) dotClass = res.pass ? 'pass' : 'fail';
            html += `
              <div class="tree-item scenario-item ${sActive ? 'active' : ''}" onclick="selectScenario('${p.id}', '${a.id}', '${s.id}')">
                <span class="status-dot ${dotClass}"></span>
                <span class="name" title="${s.name}">${s.name}</span>
              </div>
            `;
          }
          html += '</div>';
        }
      }
      if (p.apis.length === 0) {
        html += '<div style="padding:6px 8px 6px 14px; font-size:12px; color:#c9cdd4;">暂无接口</div>';
      }
      html += '</div>';
    }
  }
  if (state.projects.length === 0) {

function renderScenarioView(content) {
  const p = findProject(state.selected.projectId);
  const a = findApi(state.selected.projectId, state.selected.apiId);
  const s = findScenario(state.selected.projectId, state.selected.apiId, state.selected.scenarioId);
  if (!p || !a || !s) return;

  const url = buildUrl(p.baseUrl, a.path, mergedVars(p, s));
  const result = state.lastResults[s.id];

  const tabs = [
    { key: 'request', label: '请求' },
    { key: 'assert', label: '断言' },
    { key: 'response', label: '响应' + (result ? (result.pass ? ' ✓' : ' ✗') : '') }
  ];

  let html = `
    <div class="scene-header">
      <div class="scene-title-row">
        <input class="scene-name" value="${s.name}" onchange="updateScenarioName(this.value)" placeholder="场景名称">
        <label class="switch">
          <input type="checkbox" ${s.enabled ? 'checked' : ''} onchange="toggleScenarioEnabled(this.checked)">
          <span class="switch-slider"></span>
        </label>
        <button class="btn btn-small btn-danger" onclick="deleteScenarioCur()">删除</button>
        <button class="run-btn" id="runBtn" onclick="runCurrentScenario()">▶ 发送</button>
      </div>
      <div class="url-row">
        <select class="method-select" disabled>
          <option>${a.method}</option>
        </select>
        <input class="url-input" value="${url}" readonly title="完整URL">
      </div>
    </div>

    <div class="tabs">
      ${tabs.map(t => `<div class="tab ${state.activeTab === t.key ? 'active' : ''}" onclick="switchTab('${t.key}')">${t.label}</div>`).join('')}

    <div class="content" style="padding-top:16px;">
  `;

  if (state.activeTab === 'request') {
    html += renderRequestTab(p, a, s);
  } else if (state.activeTab === 'assert') {
    html += renderAssertTab(s);
  } else if (state.activeTab === 'response') {
    html += renderResponseTab(result);
  }

  html += '</div>';
  content.innerHTML = html;
}

function renderRequestTab(project, api, scenario) {
  const headers = scenario.headers || {};
  const variables = scenario.variables || {};
  const hasBody = ['POST', 'PUT', 'PATCH'].includes(api.method);

  let html = '';

  if (Object.keys(variables).length > 0 || true) {
    html += `
      <div class="form-group">
        <label>变量 <span class="muted" style="font-weight:normal;">(替换 URL 中的 {参数名}、body 中的 {{参数名}}；项目变量在“编辑项目”里)</span></label>
        <div class="kv-editor" id="varsEditor">${renderKvEditor(variables, 'vars')}</div>
      </div>
    `;
  }

  html += `
    <div class="form-group">
      <label>请求头 <span class="muted" style="font-weight:normal;">(覆盖公共头)</span></label>
      <div class="kv-editor" id="headersEditor">${renderKvEditor(headers, 'headers')}</div>
    </div>
  `;

  if (hasBody) {
    const bodyStr = JSON.stringify(scenario.body || {}, null, 2);
    html += `
      <div class="form-group">
        <label>请求体 (JSON)</label>
        <div class="json-editor" id="bodyEditor">
          <div class="toolbar">
            <span>JSON</span>
            <div class="actions">
              <button onclick="formatBody()">格式化</button>
            </div>
          </div>
          <textarea id="bodyTextarea" spellcheck="false" onchange="saveBody()" onblur="saveBody()">${bodyStr}</textarea>
        </div>
      </div>
    `;
  }

  return html;
}

function renderKvEditor(obj, type) {
  const entries = Object.entries(obj || {});
  let html = entries.map(([k, v], i) => `
    <div class="kv-row">
      <input type="text" value="${k}" placeholder="key" onchange="updateKv('${type}', ${i}, 'key', this.value)">
      <input type="text" value="${v}" placeholder="value" onchange="updateKv('${type}', ${i}, 'value', this.value)">
      <button class="del-btn" onclick="deleteKv('${type}', ${i})">✕</button>
    </div>
  `).join('');
  html += `<div class="kv-add" onclick="addKv('${type}')">+ 添加一项</div>`;
  return html;
}

function renderAssertTab(scenario) {
  const assertions = scenario.assertions || [];
  let html = `
    <div class="form-group">
      <label>断言规则 <span class="muted" style="font-weight:normal;">(所有断言通过才算测试通过)</span></label>
      <div class="assertion-list" id="assertionsList">
  `;

  if (assertions.length === 0) {
    html += '<div style="padding:20px;text-align:center;color:#c9cdd4;font-size:13px;">暂无断言，点击下方添加</div>';
  } else {
    html += assertions.map((a, i) => `
      <div class="assertion-item">
        <select class="as-type" onchange="updateAssertion(${i}, 'type', this.value)">
          <option value="status_code" ${a.type === 'status_code' ? 'selected' : ''}>状态码</option>
          <option value="json_path" ${a.type === 'json_path' ? 'selected' : ''}>JSON等于</option>
          <option value="exists" ${a.type === 'exists' ? 'selected' : ''}>字段存在</option>
          <option value="contains" ${a.type === 'contains' ? 'selected' : ''}>包含文本</option>
        </select>
        ${(a.type === 'json_path' || a.type === 'exists') ? `<input class="as-path" type="text" value="${a.path || ''}" placeholder="$.data.code" onchange="updateAssertion(${i}, 'path', this.value)">` : ''}
        ${a.type === 'json_path' ? `<span style="color:#c9cdd4;">=</span>` : ''}
        ${a.type === 'json_path' ? `<input class="as-value" type="text" value="${a.value ?? ''}" placeholder="期望值" onchange="updateAssertion(${i}, 'value', this.value)">` : ''}
        ${a.type === 'contains' ? `<input class="as-value" type="text" value="${a.value ?? ''}" placeholder="要包含的文本" onchange="updateAssertion(${i}, 'value', this.value)" style="flex:2;">` : ''}
        <button class="del-btn" onclick="deleteAssertion(${i})">✕</button>
      </div>
    `).join('');
  }

  html += `
      <div class="assertion-add" onclick="addAssertion()">+ 添加断言</div>
    </div>
  </div>
  `;
  return html;
}

function renderResponseTab(result) {
  if (!result) {
    return '<div class="empty" style="padding:80px;"><div class="icon">📡</div><p>还没有发送请求</p><p class="tip">点击右上角"发送"按钮运行测试</p></div>';
  }

  const isSuccess = result.pass;
  const statusClass = isSuccess ? 'success' : 'error';
  const statusText = result.status === 0 ? '(网络错误)' : result.statusText;

  let html = `
    <div class="response-status ${statusClass}">
      <span class="code">${result.status}</span>
      <span>${statusText}</span>
      <span class="time">耗时 ${result.duration}ms</span>
    </div>
  `;

  if (result.error) {
    html += `
      <div style="padding:12px 14px;background:#ffece8;border-radius:4px;margin-bottom:14px;color:#cb2634;font-size:13px;line-height:1.6;">
        <div style="font-weight:500;margin-bottom:4px;">请求失败</div>
        <div>${result.error}</div>
        ${result.status === 0 ? `
        <div style="margin-top:8px;padding-top:8px;border-top:1px solid #fab8b4;color:#86909c;font-size:12px;line-height:1.8;">
          可能原因：<br>
          1. 服务未启动或地址错误<br>
          2. CORS 跨域限制（浏览器安全策略）<br>
          3. 网络连接问题
        </div>` : ''}
      </div>
    `;
  }

  if (result.assertionResults && result.assertionResults.length > 0) {
    const passCount = result.assertionResults.filter(a => a.pass).length;
    html += `
      <div class="form-group">
        <label>断言结果 (${passCount}/${result.assertionResults.length} 通过)</label>
        <div class="assertion-results">
          ${result.assertionResults.map(a => {
            const expectedStr = formatAssertValue(a.expected, 80);
            const actualStr = formatAssertValue(a.actual, 80);
            return `
            <div class="assertion-result ${a.pass ? 'pass' : 'fail'}">
              <span class="icon">${a.pass ? '✓' : '✗'}</span>
              <span class="detail">${a.type}: ${a.path || 'status'} = ${expectedStr}</span>
              ${!a.pass ? `<span class="actual" title="${typeof a.actual === 'string' ? a.actual.replace(/"/g,'&quot;') : JSON.stringify(a.actual).replace(/"/g,'&quot;')}">实际: ${actualStr}</span>` : ''}
            </div>
          `}).join('')}
        </div>
      </div>
    `;
  }

  const bodyDisplay = typeof result.responseBody === 'string'
    ? result.responseBody
    : JSON.stringify(result.responseBody, null, 2);

  html += `
    <div class="form-group">
      <label>响应体</label>
      <div class="response-body">${bodyDisplay || '(空)'}</div>
    </div>
  `;

  return html;
}

// ===== 操作函数 =====

function selectProject(id) {
  state.selected = { projectId: id, apiId: null, scenarioId: null };
  state.activeTab = 'request';
  renderSidebar();
  renderContent();
}

function selectApi(pid, aid) {
  state.selected = { projectId: pid, apiId: aid, scenarioId: null };
  state.activeTab = 'request';
  renderSidebar();
  renderContent();
}

function selectScenario(pid, aid, sid) {
  state.selected = { projectId: pid, apiId: aid, scenarioId: sid };
  state.activeTab = 'request';
  renderSidebar();
  renderContent();
}

function switchTab(key) {
  state.activeTab = key;
  renderContent();
}

function buildUrl(base, path, vars) {
  let url = base.replace(/\/$/, '') + path;
  if (vars) {
    for (const [k, v] of Object.entries(vars)) {
      url = url.replace(new RegExp('\\{' + k + '\\}', 'g'), v);
      url = url.replace(new RegExp('\\{\\{' + k + '\\}\\}', 'g'), v);
    }
  }
  return url;
}

// 合并项目级 + 场景级变量（场景优先）
function mergedVars(project, scenario) {
  return { ...(project.variables || {}), ...(scenario.variables || {}) };
}

// body 模板替换："{{k}}" 带引号位 → 原值（数字不加引号，非数字保留 JSON 字符串形式）；{{k}} 串内位 → 文本
function renderBody(body, vars) {
  let s = JSON.stringify(body);
  for (const [k, v] of Object.entries(vars)) {
    const sv = String(v);
    const quoted = /^-?\d+(\.\d+)?$/.test(sv) ? sv : JSON.stringify(sv);
    s = s.split('"{{' + k + '}}"').join(quoted);
    s = s.split('{{' + k + '}}').join(sv);
  }
  return s;
}

function getCurScenario() {
  return findScenario(state.selected.projectId, state.selected.apiId, state.selected.scenarioId);
}

function updateScenarioName(name) {
  const s = getCurScenario();
  if (!s) return;
  s.name = name;
  saveData();
  renderSidebar();
  renderBreadcrumb();
}

function toggleScenarioEnabled(enabled) {
  const s = getCurScenario();
  if (!s) return;
  s.enabled = enabled;
  saveData();
  renderSidebar();
}

function deleteScenarioCur() {
  if (!confirm('确定删除此场景？')) return;
  deleteScenario(state.selected.projectId, state.selected.apiId, state.selected.scenarioId);
}

// KV 编辑器
function getKvTarget(type) {
  const s = getCurScenario();
  if (!s) return null;
  if (type === 'vars') {
    if (!s.variables) s.variables = {};
    return { obj: s.variables };
  } else if (type === 'headers') {
    if (!s.headers) s.headers = {};
    return { obj: s.headers };
  }
  return null;
}

function updateKv(type, index, field, value) {
  const target = getKvTarget(type);
  if (!target) return;
  const keys = Object.keys(target.obj);
  const oldKey = keys[index];
  if (field === 'key') {
    const oldValue = target.obj[oldKey];
    delete target.obj[oldKey];
    target.obj[value] = oldValue;
  } else {
    target.obj[oldKey] = value;
  }
  saveData();
}

function deleteKv(type, index) {
  const target = getKvTarget(type);
  if (!target) return;
  const keys = Object.keys(target.obj);
  delete target.obj[keys[index]];
  saveData();
  renderContent();
}

function addKv(type) {
  const target = getKvTarget(type);
  if (!target) return;
  target.obj[''] = '';
  saveData();
  renderContent();
}

// Body
function formatBody() {
  const ta = document.getElementById('bodyTextarea');
  try {
    const obj = JSON.parse(ta.value || '{}');
    ta.value = JSON.stringify(obj, null, 2);
    saveBody();
    toast('格式化成功', 'success');
  } catch (e) {
    toast('JSON格式错误', 'error');
  }
}

function saveBody() {
  const s = getCurScenario();
  if (!s) return;
  const ta = document.getElementById('bodyTextarea');
  const editor = document.getElementById('bodyEditor');
  try {
    s.body = JSON.parse(ta.value || '{}');
    editor.classList.remove('invalid');
    saveData();
  } catch (e) {
    editor.classList.add('invalid');
  }
}

// 断言
function updateAssertion(index, field, value) {
  const s = getCurScenario();
  if (!s || !s.assertions[index]) return;
  if (field === 'value') {
    const num = Number(value);
    if (!isNaN(num) && value !== '' && String(num) === value) {
      s.assertions[index][field] = num;
    } else {
      s.assertions[index][field] = value;
    }
  } else {
    s.assertions[index][field] = value;
  }
  saveData();
  if (field === 'type') renderContent();
}

function deleteAssertion(index) {
  const s = getCurScenario();
  if (!s) return;
  s.assertions.splice(index, 1);
  saveData();
  renderContent();
}

function addAssertion() {
  const s = getCurScenario();
  if (!s) return;
  if (!s.assertions) s.assertions = [];
  s.assertions.push({ type: 'status_code', path: '', value: 200 });
  saveData();
  renderContent();
}

// 运行测试
async function runCurrentScenario() {
  const { projectId, apiId, scenarioId } = state.selected;
  await runScenario(projectId, apiId, scenarioId);
}

async function runScenario(pid, aid, sid) {
  const p = findProject(pid);
  const a = findApi(pid, aid);
  const s = findScenario(pid, aid, sid);
  if (!p || !a || !s) return;

  const btn = document.getElementById('runBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="loading"></span> 发送中...'; }

  const result = await executeScenario(p, a, s);
  state.lastResults[sid] = result;
  saveData();

  state.activeTab = 'response';
  state.selected.scenarioId = sid;
  renderSidebar();
  renderContent();

  toast(result.pass ? '测试通过 ✓' : '测试失败 ✗', result.pass ? 'success' : 'error');
}

async function executeScenario(project, api, scenario) {
  const startTime = Date.now();
  const vars = mergedVars(project, scenario);
  const url = buildUrl(project.baseUrl, api.path, vars);
  const headers = { ...project.headers, ...scenario.headers };
  const options = { method: api.method, headers };
  if (['POST', 'PUT', 'PATCH'].includes(api.method) && scenario.body) {
    options.body = renderBody(scenario.body, vars);
  }

  let status = 0, statusText = '', responseBody = '', error = null;
  try {
    const resp = await fetch(url, options);
    status = resp.status;
    statusText = resp.statusText;
    const text = await resp.text();
    try { responseBody = JSON.parse(text); } catch { responseBody = text; }
  } catch (e) {
    error = e.message;
  }

  const duration = Date.now() - startTime;
  const assertionResults = runAssertions(scenario.assertions || [], status, responseBody);
  const pass = assertionResults.length > 0
    ? assertionResults.every(a => a.pass)
    : (status >= 200 && status < 300);

  return { status, statusText, responseBody, error, duration, pass, assertionResults, timestamp: Date.now() };
}

function runAssertions(assertions, status, responseBody) {
  const results = [];
  const bodyStr = typeof responseBody === 'string' ? responseBody : JSON.stringify(responseBody);
  const bodyObj = typeof responseBody === 'object' ? responseBody : (() => { try { return JSON.parse(responseBody); } catch { return null; } })();

  for (const a of assertions) {
    let pass = false, actual = '', expected = a.value;
    switch (a.type) {
      case 'status_code':
        actual = status; pass = status === a.value; break;
      case 'json_path':
        actual = jsonPath(bodyObj, a.path);
        pass = JSON.stringify(actual) === JSON.stringify(a.value) || actual === a.value;
        break;
      case 'exists':
        actual = jsonPath(bodyObj, a.path);
        expected = '存在且不为空';
        if (actual === undefined || actual === null) {
          pass = false;
        } else if (typeof actual === 'string') {
          pass = actual.length > 0;
        } else if (Array.isArray(actual)) {
          pass = actual.length > 0;
        } else {
          pass = true;
        }
        break;
      case 'contains':
        actual = bodyStr; pass = bodyStr.includes(String(a.value)); break;
    }
    results.push({ type: a.type, path: a.path, expected, actual, pass });
  }
  return results;
}

function formatAssertValue(val, maxLen = 60) {
  if (val === undefined) return 'undefined';
  if (val === null) return 'null';
  if (typeof val === 'object') {
    const str = JSON.stringify(val);
    if (str.length > maxLen) return str.slice(0, maxLen) + '...';
    return str;
  }
  const s = String(val);
  if (s.length > maxLen) return s.slice(0, maxLen) + '...';
  return s;
}

function jsonPath(obj, path) {
  if (!obj || !path) return undefined;
  if (path.startsWith('$.')) path = path.slice(2);
  const parts = path.split('.');
  let cur = obj;
  for (const part of parts) {
    if (cur == null) return undefined;
    const m = part.match(/^(.+)\[(\d+)\]$/);
    if (m) {
      cur = cur[m[1]];
      if (Array.isArray(cur)) cur = cur[parseInt(m[2])];
    } else {
      cur = cur[part];
    }
  }
  return cur;
}

async function runAllScenarios(pid, aid) {
  const p = findProject(pid);
  const a = findApi(pid, aid);
  if (!p || !a) return;
  const enabled = a.scenarios.filter(s => s.enabled);
  if (enabled.length === 0) { toast('没有启用的场景', 'error'); return; }

  const results = [];
  for (const s of enabled) {
    const r = await executeScenario(p, a, s);
    state.lastResults[s.id] = r;
    results.push({ scenarioId: s.id, name: s.name, result: r });
  }
  saveData();

  const passCount = results.filter(r => r.result.pass).length;
  showBatchResult(`${p.name} / ${a.name}`, results, passCount, enabled.length);
  renderSidebar();
}

async function runProject(pid) {
  const p = findProject(pid);
  if (!p) return;
  const all = [];
  for (const a of p.apis) {
    for (const s of a.scenarios.filter(x => x.enabled)) {
      all.push({ api: a, scenario: s });
    }
  }
  if (all.length === 0) { toast('没有启用的场景', 'error'); return; }

  const results = [];
  for (const { api, scenario } of all) {
    const r = await executeScenario(p, api, scenario);
    state.lastResults[scenario.id] = r;
    results.push({ scenarioId: scenario.id, name: `${api.name} / ${scenario.name}`, result: r });
  }
  saveData();

  const passCount = results.filter(r => r.result.pass).length;
  showBatchResult(p.name, results, passCount, all.length);
  renderSidebar();
}

function showBatchResult(title, results, passCount, total) {
  const content = document.getElementById('mainContent');
  document.getElementById('breadcrumb').innerHTML = `<span style="color:#1f2329;font-weight:500;">${title} - 测试报告</span>`;
  document.getElementById('topbarActions').innerHTML = '';

  let html = `
    <div style="display:flex;gap:16px;margin-bottom:20px;">
      <div style="padding:16px 24px;background:#f7f8fa;border-radius:6px;text-align:center;">
        <div style="font-size:28px;font-weight:600;color:#3370ff;">${total}</div>
        <div style="font-size:12px;color:#86909c;margin-top:4px;">总用例</div>
      </div>
      <div style="padding:16px 24px;background:#e8ffea;border-radius:6px;text-align:center;">
        <div style="font-size:28px;font-weight:600;color:#00b42a;">${passCount}</div>
        <div style="font-size:12px;color:#86909c;margin-top:4px;">通过</div>
      </div>
      <div style="padding:16px 24px;background:#ffece8;border-radius:6px;text-align:center;">
        <div style="font-size:28px;font-weight:600;color:#f53f3f;">${total - passCount}</div>
        <div style="font-size:12px;color:#86909c;margin-top:4px;">失败</div>
      </div>
    </div>
  `;

  for (const r of results) {
    const { result, name } = r;
    html += `
      <div class="api-card">
        <div class="api-card-header" style="background:${result.pass ? '#fafffb' : '#fff7f7'};cursor:default;">
          <span class="status-dot ${result.pass ? 'pass' : 'fail'}" style="width:10px;height:10px;border-radius:50%;"></span>
          <span class="name">${name}</span>
          <span class="path muted">${result.duration}ms</span>
          <span class="count">${result.status}</span>
        </div>
      </div>
    `;
  }

  content.innerHTML = html;
}

// 导入导出
function exportData() {
  const data = JSON.stringify(state.projects, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `scenario-tester-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data)) {
        if (confirm(`导入 ${data.length} 个项目？将覆盖当前数据。`)) {
          state.projects = data;
          state.lastResults = {};
          state.selected = { projectId: null, apiId: null, scenarioId: null };
          saveData(); renderSidebar(); renderContent();
          toast('导入成功', 'success');
        }
      } else toast('数据格式错误', 'error');
    } catch { toast('JSON解析失败', 'error'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}
